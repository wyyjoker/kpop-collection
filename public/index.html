<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7cfe0" />
    <meta name="application-name" content="K-pop 收藏日记" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="module" src="/app.js?v=0.7-photos"></script>
