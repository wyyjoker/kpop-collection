name: CI

on:
  push:
    branches: [main, feature/v0.1b, feature/v0.2, feature/v0.3, feature/v0.4, feature/v0.5a, feature/v0.5a-polish, feature/v0.5a-hero-collage, feature/seventeen-catalog]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Build Sites worker
        run: npm run build

      - name: Frontend, backup and catalog regression tests
        run: npm test

      - name: Native Workers integration tests
        run: npm run test:sites:workers

      - name: Validate PWA, scrapbook and catalog assets
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest', 'utf8'))"
          node - <<'NODE'
          const catalog = require('./public/data/seventeen-catalog.json');
          const tracks = catalog.albums.reduce((sum, album) => sum + (album.discs || []).reduce((discSum, disc) => discSum + (disc.tracks || []).length, 0), 0);
          if (catalog.group.name !== 'SEVENTEEN') throw new Error('SEVENTEEN group metadata missing');
          if (catalog.albums.length < 32) throw new Error(`Expected at least 32 SEVENTEEN physical releases, found ${catalog.albums.length}`);
          if (tracks < 250) throw new Error(`Track catalog unexpectedly small: ${tracks}`);
          if (catalog.albums.some((album) => !album.cover || !album.release_date || !(album.discs || []).length)) throw new Error('A release is missing cover/date/tracklist data');
          console.log(`Validated ${catalog.albums.length} SEVENTEEN releases / ${tracks} tracks`);
          NODE
          test -f public/icons/icon-192.png
          test -f public/icons/icon-512.png
          test -f public/icons/icon-maskable-512.png
          test -f public/icons/apple-touch-icon.png
          test -f public/scrapbook.css
          test -f public/reference-masthead.css
          test -f public/assets/scrapbook/reference-masthead.png
          test -f public/js/store.js
          test -f public/js/pages.js
          test -f public/js/dialogs.js
          test -f public/assets/scrapbook/collection-corner.png
          test -f public/app-v0.5a.js
          test -f public/app-v0.5a-polish.js
          test -f public/app-v0.5a-hero.js
          test -f public/app-v0.5a-seventeen.js
          test -f public/v0.5a.css
          test -f public/v0.5a-polish.css
          test -f public/v0.5a-hero.css
          test -f public/v0.5a-seventeen.css
          test -f scripts/seed-seventeen.js
          test -f public/data/seventeen-catalog.json
          test -f public/assets/scrapbook/paper-grid.svg
          test -f public/assets/scrapbook/doodle-heart.svg
          test -f public/assets/scrapbook/doodle-star.svg
          test -f public/assets/scrapbook/doodle-bunny.svg
          test -f public/assets/scrapbook/doodle-flower.svg
          test -f public/assets/scrapbook/doodle-bow.svg
          test -f public/assets/scrapbook/room-shelf.svg
          test -f public/assets/scrapbook/vinyl-corner.svg

      - name: Validate SEVENTEEN seed
        shell: bash
        run: |
          rm -f /tmp/kpop-svt-test.db
          DB_PATH=/tmp/kpop-svt-test.db node scripts/seed-seventeen.js
          node - <<'NODE'
          const sqlite3 = require('sqlite3').verbose();
          const db = new sqlite3.Database('/tmp/kpop-svt-test.db');
          db.get(`SELECT COUNT(*) albums FROM albums a JOIN groups g ON g.id=a.group_id WHERE g.name='SEVENTEEN'`, (error, row) => {
            if (error) throw error;
            if (row.albums < 32) throw new Error(`Seeded only ${row.albums} releases`);
            db.get('SELECT COUNT(*) tracks FROM album_tracks', (trackError, trackRow) => {
              if (trackError) throw trackError;
              if (trackRow.tracks < 250) throw new Error(`Seeded only ${trackRow.tracks} tracks`);
              console.log(`Seeded ${row.albums} releases / ${trackRow.tracks} tracks`);
              db.close();
            });
          });
          NODE

      - name: Smoke test server
        shell: bash
        run: |
          export DB_PATH=/tmp/kpop-collection-ci.db
          rm -f "$DB_PATH"
          npm start > /tmp/kpop-collection.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              curl -fsS http://127.0.0.1:3000/manifest.webmanifest >/dev/null
              curl -fsS http://127.0.0.1:3000/sw.js >/dev/null
              curl -fsS http://127.0.0.1:3000/scrapbook.css >/dev/null
              curl -fsS http://127.0.0.1:3000/js/pages.js >/dev/null
              curl -fsS http://127.0.0.1:3000/api/library >/dev/null
              curl -fsS http://127.0.0.1:3000/api/profile >/dev/null
              curl -fsS http://127.0.0.1:3000/app-v0.5a-seventeen.js >/dev/null
              curl -fsS http://127.0.0.1:3000/v0.5a-seventeen.css >/dev/null
              curl -fsS http://127.0.0.1:3000/data/seventeen-catalog.json >/dev/null
              curl -fsS http://127.0.0.1:3000/api/groups | grep -q 'SEVENTEEN'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kpop-collection.log
          exit 1
